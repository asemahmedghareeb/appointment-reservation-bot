<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VFS Global - Select Slot</title>
</head>
<body>
  <h1>Select Slot</h1>
  <div class="slot-notice">
    <p>Earliest available slot for 1-2 applicants: 2026-11-16</p>
    <p>Earliest available slot for 3-4 applicants: 2026-11-17</p>
  </div>
  <form action="/slot-selection" method="POST">
    <div class="slot-item" data-slot-date="2026-11-16">
      <input type="radio" id="slot-1" name="slot" value="2026-11-16" />
      <label for="slot-1">16 November 2026 - 09:00 AM</label>
    </div>
    <div class="slot-item" data-slot-date="2026-11-17">
      <input type="radio" id="slot-2" name="slot" value="2026-11-17" />
      <label for="slot-2">17 November 2026 - 09:30 AM</label>
    </div>
    <button id="continue-slot" type="submit">Continue</button>
  </form>
</body>
</html>
