<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VFS Global - OTP Verification</title>
</head>
<body>
  <h1>Security Check</h1>
  <p>Verify your identity with OTP sent to your registered contact.</p>
  <div class="otp-form" data-testid="otp-container">
    <label for="otp">Enter 6-digit One-Time Password</label>
    <input type="text" id="otp" name="otp" maxlength="6" />
    <button type="submit">Verify OTP</button>
  </div>
</body>
</html>
